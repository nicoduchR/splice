<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Splice License Grace Period Warning</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "warning": "#FAAD14",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<!-- Overlay / Backdrop -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
<!-- Modal Container -->
<div class="relative w-full max-w-[480px] bg-[#1a2632] rounded-xl shadow-2xl border border-white/5 overflow-hidden flex flex-col">
<!-- Close Icon (Top Right) -->
<button class="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
<!-- Modal Content -->
<div class="flex flex-col items-center px-8 pt-10 pb-8 w-full">
<!-- Status Icon -->
<div class="mb-5 flex items-center justify-center">
<span class="material-symbols-outlined text-[#FAAD14] text-[56px] leading-none">warning</span>
</div>
<!-- Headline -->
<h2 class="text-white text-2xl font-bold leading-tight text-center mb-6">
                    Vérification de licence requise
                </h2>
<!-- Alert Box -->
<div class="w-full bg-[#FAAD14]/10 border border-[#FAAD14] rounded-lg p-4 mb-6">
<div class="flex gap-3">
<span class="material-symbols-outlined text-[#FAAD14] shrink-0 text-xl mt-0.5">info</span>
<p class="text-[#e2e8f0] text-sm font-normal leading-relaxed">
                            Vous avez été hors ligne pendant <strong class="text-white">6 jours</strong>. Une vérification est nécessaire pour continuer à utiliser Splice.
                        </p>
</div>
</div>
<!-- Progress Bar Section -->
<div class="w-full flex flex-col gap-2 mb-8">
<div class="flex justify-between items-end mb-1">
<span class="text-white text-sm font-medium">Période de grâce hors ligne</span>
<span class="text-[#FAAD14] text-xs font-bold">85%</span>
</div>
<div class="relative h-2 w-full rounded-full bg-[#324d67] overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-[#FAAD14] rounded-full" style="width: 85%;"></div>
</div>
<div class="flex justify-between mt-1">
<span class="text-[#94a3b8] text-xs">Jours écoulés</span>
<span class="text-[#94a3b8] text-xs font-medium">6 sur 7 jours autorisés</span>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-3">
<button class="w-full h-11 bg-primary hover:bg-primary/90 transition-colors text-white font-bold text-sm rounded-lg flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]">sync</span>
                        Vérifier maintenant
                    </button>
<button class="w-full h-10 text-[#94a3b8] hover:text-white transition-colors text-sm font-medium">
                        Me rappeler plus tard
                    </button>
</div>
</div>
<!-- Bottom Texture (Optional visual flair for "Pro" look) -->
<div class="h-1 w-full bg-gradient-to-r from-transparent via-[#FAAD14]/50 to-transparent opacity-20"></div>
</div>
</div>
<!-- Background Elements (Simulating the app behind the modal) -->
<div aria-hidden="true" class="relative flex h-screen w-full flex-col overflow-hidden pointer-events-none">
<!-- Top Bar -->
<div class="h-14 border-b border-white/5 bg-[#101922] flex items-center px-4 justify-between">
<div class="w-32 h-6 bg-white/10 rounded"></div>
<div class="flex gap-4">
<div class="w-8 h-8 rounded-full bg-white/10"></div>
<div class="w-8 h-8 rounded-full bg-white/10"></div>
</div>
</div>
<div class="flex flex-1 overflow-hidden">
<!-- Sidebar -->
<div class="w-64 border-r border-white/5 bg-[#101922] hidden md:flex flex-col gap-4 p-4">
<div class="w-full h-8 bg-white/5 rounded"></div>
<div class="w-full h-8 bg-white/5 rounded"></div>
<div class="w-3/4 h-8 bg-white/5 rounded"></div>
<div class="mt-auto w-full h-32 bg-white/5 rounded-lg" data-alt="Abstract timeline visualization placeholder"></div>
</div>
<!-- Main Content Area -->
<div class="flex-1 bg-[#0b1219] p-8 flex flex-col gap-6">
<div class="w-full aspect-video bg-[#1a2632] rounded-lg border border-white/5 flex items-center justify-center">
<span class="material-symbols-outlined text-white/10 text-6xl">movie</span>
</div>
<div class="h-32 w-full bg-[#1a2632] rounded-lg border border-white/5 relative overflow-hidden">
<div class="absolute top-0 left-0 bottom-0 w-1/3 bg-primary/10 border-r border-primary/20"></div>
</div>
</div>
</div>
</div>
</body></html>
