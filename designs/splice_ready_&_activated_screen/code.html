<!DOCTYPE html>

<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>

<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1580f9",
                        "success": "#52C41A",
                        "background-light": "#f5f7f8",
                        "background-dark": "#1A1A1F", // Specific requested background
                        "surface-dark": "#25252b", // Slightly lighter for card
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "md": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for dark theme if needed */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1A1A1F;
        }
        ::-webkit-scrollbar-thumb {
            background: #333; 
            border-radius: 4px;
        }
    </style>

<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4">
<!-- Main Container -->

<div class="bg-white dark:bg-surface-dark rounded-xl shadow-2xl overflow-hidden border border-gray-200 dark:border-gray-800 p-8 sm:p-10 flex flex-col items-center text-center animate-fade-in-up">

<div class="mb-6 text-success animate-bounce-subtle">
<span class="material-symbols-outlined text-[64px]" style="font-size: 64px; font-variation-settings: 'FILL' 1, 'wght' 700;">

                </span>
</div>

<h1 class="text-gray-900 dark:text-white font-display text-3xl font-bold leading-tight mb-2 tracking-tight">

<p class="text-gray-500 dark:text-gray-400 font-body text-sm mb-6">

            </p>

<div class="w-full bg-[#52C41A]/10 dark:bg-[#52C41A]/20 border border-success rounded-lg p-4 mb-8 flex items-start gap-3 text-left">
<span class="material-symbols-outlined text-success shrink-0 mt-0.5" style="font-size: 20px;">

                </span>
<div class="text-sm text-gray-800 dark:text-gray-200 font-medium">
                    Configuration terminée avec succès. Tous les modules sont opérationnels.
                </div>
</div>

<div class="w-full space-y-4 mb-10">
<!-- Item 1 -->
<div class="flex items-center gap-3 text-left group">
<div class="flex items-center justify-center size-6 rounded-full bg-success/20 text-success shrink-0">
<span class="material-symbols-outlined" style="font-size: 16px; font-variation-settings: 'wght' 700;">check</span>
</div>
<p class="text-gray-700 dark:text-gray-200 text-base font-normal leading-normal group-hover:text-white transition-colors duration-200">

                    </p>
</div>
<!-- Item 2 -->
<div class="flex items-center gap-3 text-left group">
<div class="flex items-center justify-center size-6 rounded-full bg-success/20 text-success shrink-0">

</div>
<p class="text-gray-700 dark:text-gray-200 text-base font-normal leading-normal group-hover:text-white transition-colors duration-200">

                    </p>
</div>
<!-- Item 3 -->
<div class="flex items-center gap-3 text-left group">
<div class="flex items-center justify-center size-6 rounded-full bg-success/20 text-success shrink-0">
<span class="material-symbols-outlined" style="font-size: 16px; font-variation-settings: 'wght' 700;">check</span>
</div>
<p class="text-gray-700 dark:text-gray-200 text-base font-normal leading-normal group-hover:text-white transition-colors duration-200">
                        Import vidéo jusqu'à 50GB
                    </p>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary hover:bg-primary/90 transition-colors text-white font-bold text-base h-12 rounded-lg flex items-center justify-center gap-2 shadow-lg shadow-primary/25 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-[#1A1A1F]">
<span>Commencer</span>
<span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</div>
<!-- Subtle Footer Branding -->
<div class="mt-8 text-center opacity-40 hover:opacity-100 transition-opacity duration-300">
<div class="flex items-center justify-center gap-2 text-white text-sm font-medium">
<span class="size-4 bg-white rounded-full block"></span>
<span>Splice Pro</span>
</div>
</div>
