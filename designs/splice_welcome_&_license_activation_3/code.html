<!DOCTYPE html>
<html class="dark" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Splice Welcome &amp; License Activation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0D7EFF", // Updated blue
                        "error": "#FF4D4F", // Added error red
                        "background-light": "#f5f7f8",
                        "background-dark": "#1A1A1F",
                        "surface-dark": "#25252D",
                        "input-dark": "#2F2F38",
                        "text-secondary": "#A1A1AA",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem",
                        "lg": "0.5rem", 
                        "xl": "0.75rem", 
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display text-white selection:bg-primary/30">
<header class="w-full border-b border-[#2F2F38] px-6 py-4 flex items-center justify-between bg-surface-dark/50 backdrop-blur-sm sticky top-0 z-50">
<div class="flex items-center gap-3">
<div class="size-8 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[32px] font-variation-FILL-1">movie</span>
</div>
<h1 class="text-white text-xl font-bold tracking-tight">Splice</h1>
</div>
<div class="flex items-center gap-4">
<div class="size-8 rounded-full bg-[#2F2F38] flex items-center justify-center text-text-secondary hover:text-white transition-colors cursor-pointer">
<span class="material-symbols-outlined text-sm">settings</span>
</div>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-center p-6 relative overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px] pointer-events-none"></div>
<div class="relative w-full max-w-[480px] bg-surface-dark border border-[#2F2F38] rounded-xl shadow-2xl overflow-hidden flex flex-col">
<div class="p-8 sm:p-10 flex flex-col items-center text-center">
<div class="mb-6 flex items-center justify-center size-16 rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-[40px] font-variation-FILL-1">video_library</span>
</div>
<h2 class="text-white text-2xl sm:text-3xl font-bold leading-tight mb-3">Bienvenue sur Splice</h2>
<p class="text-text-secondary text-sm leading-relaxed max-w-sm mb-8">
                    Professional video editing at the speed of thought. Enter your license key to unlock the full suite of transcription tools.
                </p>
<div class="w-full flex flex-col gap-5 text-left">
<label class="flex flex-col gap-2 group">
<span class="text-xs font-semibold tracking-wider text-text-secondary uppercase pl-1 group-focus-within:text-primary transition-colors">Code de Licence</span>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary group-focus-within:text-white transition-colors material-symbols-outlined">key</span>
<input autocomplete="off" class="w-full h-12 bg-input-dark border-2 border-error rounded-lg pl-12 pr-4 text-white placeholder-text-secondary/50 focus:border-error focus:ring-1 focus:ring-error focus:outline-none transition-all font-mono tracking-widest text-base" placeholder="XXXX-XXXX-XXXX-XXXX" type="text" value="SPLICE-8X92-M4K1-PRO"/>
</div>
<div class="flex items-center gap-1.5 text-error">
<span class="material-symbols-outlined text-[16px] font-variation-FILL-1">error</span>
<span class="text-xs font-normal">Code invalide ou connexion impossible. Veuillez réessayer.</span>
</div>
</label>
<button class="w-full h-12 bg-primary hover:bg-primary/90 active:scale-[0.99] transition-all rounded-lg text-white font-semibold text-base flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
<span>Activer</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
<div class="bg-[#1F1F25] px-8 py-4 flex justify-between items-center text-xs border-t border-[#2F2F38]">
<a class="text-text-secondary hover:text-white transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-sm">help</span> 
                    Besoin d'aide ?
                </a>
<a class="text-primary hover:text-primary/80 transition-colors font-medium" href="#">
                    Acheter une licence
                </a>
</div>
</div>
<p class="mt-8 text-xs text-text-secondary/60">
            Version 4.2.0 • Build 2023.10.24
        </p>
</main>

</body></html>
